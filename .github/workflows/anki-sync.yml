name: Generate Anki Deck

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual triggering from the GitHub UI

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit the file back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to get full git history for Component A

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install genanki GitPython

      - name: Build Anki Deck
        run: python scripts/build_deck.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add anki-decks/daily-notes.apkg
          
          # Only commit if there are changes
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update daily-notes.apkg"
            git push
          else
            echo "No changes to commit."
          fi